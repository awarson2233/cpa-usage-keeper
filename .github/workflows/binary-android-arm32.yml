name: Build android arm32 binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version string embedded in the package name and binary metadata; defaults to tag name or dev-<short-sha>'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary-android-arm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOOS: android
      GOARCH: arm
      GOARM: '7'
      ANDROID_API: '21'
      NDK_VERSION: '27.2.12479018'
      ASSET_ARCH: arm32
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install frontend dependencies
        run: npm --prefix ./web ci

      - name: Build frontend
        run: npm --prefix ./web run build

      - name: Build android arm32 binary package
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi

          package_name="cpa-usage-keeper_${version}_${GOOS}_${ASSET_ARCH}"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}/data"

          export CC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi${ANDROID_API}-clang"
          export CXX="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi${ANDROID_API}-clang++"

          CGO_ENABLED=1 GOOS="${GOOS}" GOARCH="${GOARCH}" GOARM="${GOARM}" CC="${CC}" CXX="${CXX}" \
            go build -trimpath -buildmode=pie -ldflags="-s -w -X cpa-usage-keeper/internal/version.Version=${version}" -o "${package_dir}/cpa-usage-keeper" ./cmd/server/main.go

          cp .env.example README.md README.zh.md LICENSE "${package_dir}/"
          tar -czf "dist/${package_name}.tar.gz" -C dist "${package_name}"

      - name: Upload android arm32 binary package artifact
        uses: actions/upload-artifact@v6
        with:
          name: cpa-usage-keeper-android-arm32-${{ github.run_id }}
          path: dist/cpa-usage-keeper_*_android_arm32.tar.gz
          if-no-files-found: error
